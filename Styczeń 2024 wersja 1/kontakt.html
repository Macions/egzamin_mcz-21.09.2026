<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firma IT</title>
    <link rel="stylesheet" href="styl.css">
    <link rel="shortcut icon" href="logo.png" type="image/x-icon">
    <script src="skrypt.js"></script>
</head>

<body>
    <section class="container">
        <article id="logo">
            <img src="logo.png" alt="firma it">
        </article>
        <article id="menu">
            <a href="index.html">Strona Główna</a>
            <a href="usługi.html">Usługi</a>
            <a href="kontakt.html">Kontakt</a>
        </article>
        <header id="baner">
            <img src="animacja.gif" alt="Usługi informatyczne">
        </header>
        <main>
            <h2>Kontakt</h2>
            <table>
                <tr>
                    <td>Imię</td>
                    <td><input type="text" name="imie" id="imie"></td>
                </tr>
                <tr>
                    <td>Nazwisko:</td>
                    <td><input type="text" name="nazwisko" id="nazwisko"></td>
                </tr>
                <tr>

                    <td>E-mail:</td>
                    <td><input type="email" name="email" id="email"></td>
                </tr>
                <tr>
                    <td>Zgłoszenie</td>

                    <td><textarea name="zgloszenie" id="zgloszenie" cols="40" rows="10"></textarea></td>
                </tr>
                <tr>
                    <td></td>
                    <td><input type="checkbox" name="zapoznalem" id="zapoznalem">Zapoznałam/em się z regulaminem</td>
                </tr>
                <tr>
                    <td></td>
                    <td><button type="reset">Resetuj</button></td>
                    <td><button type="button" onclick="przeslij()">Prześlij</button></td>
                </tr>
            </table>
            <p id="komunikat"></p>
            <hr>
        </main>
        <footer>
            Autor: <strong>Maciej Czarnecki</strong> (czas wykonania: 60 minut)
        </footer>
    </section>
</body>

</html>
