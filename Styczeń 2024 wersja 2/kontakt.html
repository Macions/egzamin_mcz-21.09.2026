<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Komputery</title>
    <link rel="stylesheet" href="styl.css">
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
    <script src="skrypt.js" async></script>
</head>

<body>
    <main>
        <header id="baner">
            <img src="animacja.gif" alt="Pogotowie komputerowe">
        </header>
        <menu>
            <a href="index.html">Strona Główna</a>
            <a href="kontakt.html">Kontakt</a>
        </menu>
        <section id="blok1">
        </section>
        <section id="blok2">
            <h2>Kontakt</h2>
            <table>
                <tr>
                    <td>Imię:</td>
                    <td><input type="text" name="imie" id="imie"></td>
                </tr>
                <tr>
                    <td>Nazwisko:</td>
                    <td><input type="text" name="nazwisko" id="nazwisko"></td>
                </tr>
                <tr>
                    <td>E-mail:</td>
                    <td><input type="email" name="email" id="email"></td>
                </tr>
                <tr>
                    <td>Zgłoszenie</td>
                    <td><select name="zgloszenie" id="zgloszenie">
                            <option value="naprawa">Naprawa komputerów</option>
                            <option value="odzyskiwanie danych">Odzyskiwanie danych</option>
                            <option value="wirusy">Wirusy</option>
                            <option value="konfiguracja LAN">Konfiguracja LAN</option>
                        </select></td>
                </tr>
                <tr>
                    <td></td>
                    <td><input type="checkbox" name="wyslij" id="wyslij" checked>Wyślij kopię wiadomości</td>
                </tr>
                <tr>
                    <td></td>
                    <td>
                        <button type="reset">Czyść</button>
                        <button type="button" onclick="wyslij()">Wyślij</button>
                    </td>
                </tr>
            </table>
            <hr>
            <p id="wynik"></p>
        </section>
        <section id="blok3">
        </section>
        <footer>
            Autor: <i>Maciej Czarnecki</i> (czas wykonania: )
